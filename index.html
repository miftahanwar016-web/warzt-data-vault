    <!-- PWA & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. KONFIGURASI APLIKASI
        // ==========================================
        const ID_PEMILIK = "warzt_admin_vault_1"; 

        const firebaseConfig = {
          apiKey: "AIzaSyDUqieIsgcStR3BX1kaRrRsMgbJJd7cSTQ",
          authDomain: "warztdata.firebaseapp.com",
          projectId: "warztdata",
          storageBucket: "warztdata.firebasestorage.app",
          messagingSenderId: "541850398487",
          appId: "1:541850398487:web:ae836ab8a9cbce79fc9152",
          measurementId: "G-GKN03LTD3H"
        };
        const appId = 'warzt-data';
        
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch(e) {
            console.error("Firebase Gagal Dimuat:", e);
        }

        // ==========================================
        // 2. STATE MANAGEMENT & AUTO-LOCK
        // ==========================================
        let currentUser = null;
        let currentRoute = 'login';
        let currentEditItem = null;
        let selectedAccounts = new Set();
        
        let idleTime = 0;
        function resetIdleTimer() { idleTime = 0; }
        document.body.addEventListener('mousemove', resetIdleTimer);
        document.body.addEventListener('keypress', resetIdleTimer);
        document.body.addEventListener('touchstart', resetIdleTimer);
        
        setInterval(() => {
            if(currentUser && currentRoute !== 'login') {
                idleTime++;
                if (idleTime >= 180) { window.handleLogout(); showToast('Terkunci Otomatis (3 Menit Inaktif)', 'error'); }
            }
        }, 1000);

        // ==========================================
        // 3. CORE LOGIC
        // ==========================================
        const appContent = document.getElementById('app-content');
        const bottomNav = document.getElementById('bottom-nav');
        
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
            toast.className = `${bgColor} text-white px-4 py-3 rounded-2xl shadow-lg flex items-center gap-3 transform transition-all duration-300 translate-y-[-100%] opacity-0 mb-2`;
            toast.innerHTML = `<i class="ph-bold ${type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'} text-xl"></i><span class="text-sm font-medium">${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('translate-y-[-100%]', 'opacity-0'); }, 10);
            setTimeout(() => { toast.classList.add('translate-y-[-100%]', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function fetchVaultData() {
            if (!currentUser || !db) return [];
            try {
                const vaultCol = collection(db, 'artifacts', appId, 'private_data', ID_PEMILIK, 'vault_items');
                const vaultSnapshot = await getDocs(vaultCol);
                const items = [];
                vaultSnapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                return items;
            } catch (error) { 
                showToast('Gagal memuat data. Cek koneksi.', 'error');
                return []; 
            }
        }

        async function addVaultItem(data) {
            const newItem = { ...data, createdAt: Date.now(), lastChecked: null };
            try {
                const vaultCol = collection(db, 'artifacts', appId, 'private_data', ID_PEMILIK, 'vault_items');
                await addDoc(vaultCol, newItem); return true;
            } catch (error) { return false; }
        }

        async function updateVaultItem(id, data) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'private_data', ID_PEMILIK, 'vault_items', id);
                await updateDoc(docRef, data); return true;
            } catch(e) { return false; }
        }
        
        async function deleteVaultItem(id) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'private_data', ID_PEMILIK, 'vault_items', id);
                await deleteDoc(docRef); return true;
            } catch(e) { return false; }
        }

        window.navigate = function(route) {
            resetIdleTimer();
            if(route !== 'edit') currentEditItem = null; 
            selectedAccounts.clear();
            currentRoute = route; render();
        }

        function adjustBackground(route) {
            const blob1 = document.getElementById('bg-blob-1');
            if(route === 'login') {
                blob1.style.height = '60%'; blob1.style.borderRadius = '0 0 50% 50%'; 
                bottomNav.classList.add('translate-y-full');
                bottomNav.classList.add('fallback-hidden');
            } else {
                blob1.style.height = '35%'; blob1.style.borderRadius = '0 0 30% 30%'; 
                bottomNav.classList.remove('fallback-hidden');
                bottomNav.style.display = 'flex';
                bottomNav.classList.remove('translate-y-full');
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if(btn.dataset.target === route && !['add', 'edit'].includes(route)) {
                        btn.classList.add('text-brand-blue'); btn.classList.remove('text-slate-400');
                    } else if (!['add', 'edit'].includes(route)) {
                        btn.classList.remove('text-brand-blue'); btn.classList.add('text-slate-400');
                    }
                });
            }
        }

        function render() {
            adjustBackground(currentRoute);
            let html = '';
            if (currentRoute === 'login') html = renderLoginView();
            else if (currentRoute === 'dashboard') html = renderDashboardView();
            else if (currentRoute === 'vault') html = renderVaultView();
            else if (currentRoute === 'add' || currentRoute === 'edit') html = renderAddEditView();
            else if (currentRoute === 'profile') html = renderProfileView();
            
            appContent.innerHTML = html;
            if (currentRoute === 'dashboard') loadDashboardData();
            if (currentRoute === 'vault') loadVaultData();
        }

        // --- VIEWS ---
        function renderLoginView() {
            return `
                <div class="page-enter flex flex-col items-center justify-center min-h-screen px-6 py-12 z-10 relative">
                    <div class="mb-10 text-center">
                        <div class="w-20 h-20 bg-white rounded-[2rem] flex items-center justify-center shadow-2xl mx-auto mb-4 border-2 border-white/40"><i class="ph-bold ph-shield-check text-4xl text-brand-blue"></i></div>
                        <h1 class="text-3xl font-bold text-white tracking-tight">warzt Data</h1>
                        <p class="text-white/80 text-sm mt-1">Personal Secure Vault</p>
                    </div>
                    <div class="glass-card w-full rounded-3xl p-6 sm:p-8 mt-4">
                        <h2 class="text-2xl font-bold text-slate-800 mb-1">Akses Privat</h2>
                        <p class="text-sm text-slate-500 mb-6">Masukkan PIN Master Anda</p>
                        <div class="space-y-4">
                            <div class="relative">
                                <i class="ph-bold ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="password" id="login-pin" placeholder="PIN Rahasia" class="w-full bg-white rounded-full pl-12 pr-12 py-3.5 text-sm text-slate-700 outline-none border border-slate-200 focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 transition-all shadow-sm">
                                <button onclick="window.togglePass('login-pin')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-blue"><i class="ph-bold ph-eye"></i></button>
                            </div>
                            <button onclick="window.handleLogin()" id="btn-login" class="w-full bg-brand-blue text-white rounded-full py-3.5 font-semibold shadow-lg shadow-brand-blue/30 hover:bg-blue-700 active:scale-[0.98] transition-all mt-4 flex justify-center items-center gap-2">
                                <span>Buka Brankas</span><i class="ph-bold ph-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.togglePass = function(id) {
            const input = document.getElementById(id);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === "password") { input.type = "text"; icon.classList.replace('ph-eye', 'ph-eye-slash'); } 
            else { input.type = "password"; icon.classList.replace('ph-eye-slash', 'ph-eye'); }
        }

        window.handleLogin = async function() {
            const pin = document.getElementById('login-pin').value.trim();
            if(!pin) { showToast('Harap masukkan PIN', 'error'); return; }
            
            // CEK KEAMANAN PROTOKOL BROWSER
            if (window.location.protocol === 'file:' || window.location.protocol === 'content:') {
                showToast("Akses Ditolak! Firebase tidak bisa jalan di File Lokal. Wajib di-upload ke Web/Netlify.", 'error');
                return;
            }

            document.getElementById('btn-login').innerHTML = `<i class="ph-bold ph-spinner animate-spin text-xl"></i>`;
            
            try {
                if(!auth) throw new Error("Firebase SDK gagal dimuat. Cek koneksi internet.");
                await signInAnonymously(auth); // Melakukan Anonymous Login
                
                // Hardcoded PIN
                if(pin === '123456') { currentUser = { id: ID_PEMILIK }; navigate('dashboard'); }
                else { throw new Error("PIN Salah"); }
            } catch(e) { 
                console.error(e);
                showToast(e.message, 'error'); 
                document.getElementById('btn-login').innerHTML = `<span>Buka Brankas</span><i class="ph-bold ph-arrow-right"></i>`; 
            }
        }

        function renderDashboardView() {
            return `
                <div class="page-enter px-6 pt-12 pb-6">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <p class="text-white/80 text-sm">Status Brankas</p>
                            <h2 class="text-2xl font-bold text-white">Dashboard</h2>
                        </div>
                        <div class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-full border border-white/40 flex items-center justify-center text-white">
                            <i class="ph-bold ph-chart-pie-slice text-2xl"></i>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 flex items-center gap-5 mb-6">
                        <div id="region-chart" class="donut-chart w-20 h-20 shadow-inner" style="background: conic-gradient(#2563EB 0%, #2563EB 50%, #34D399 50%, #34D399 100%);">
                            <div class="donut-inner shadow-sm"><span class="text-[10px] text-slate-400">Total</span><span id="chart-total" class="text-lg font-bold text-slate-800 leading-none">0</span></div>
                        </div>
                        <div class="flex-1 space-y-2">
                            <div class="flex justify-between items-center"><div class="flex items-center gap-1.5"><span class="text-lg">🇺🇸</span><span class="text-xs text-slate-600 font-medium">Akun US</span></div><span class="text-sm font-bold text-slate-800" id="dash-us">-</span></div>
                            <div class="flex justify-between items-center"><div class="flex items-center gap-1.5"><span class="text-lg">🇮🇩</span><span class="text-xs text-slate-600 font-medium">Akun Indo</span></div><span class="text-sm font-bold text-slate-800" id="dash-id">-</span></div>
                        </div>
                    </div>
                    
                    <div class="bg-slate-800 rounded-3xl p-5 shadow-lg shadow-slate-900/20 flex items-center gap-4 relative overflow-hidden">
                        <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-red-400 relative z-10"><i class="ph-bold ph-warning text-2xl"></i></div>
                        <div class="relative z-10">
                            <p class="text-xs text-slate-300 font-medium">Akun Bermasalah / Banned</p>
                            <h4 class="text-xl font-bold text-white" id="dash-banned">0 Akun</h4>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadDashboardData() {
            const data = await fetchVaultData();
            let cUs = 0, cId = 0, cBanned = 0;
            data.forEach(item => {
                if(item.region === 'US') cUs++;
                if(item.region === 'Indo') cId++;
                if(item.status === 'Banned') cBanned++;
            });
            const total = cUs + cId;
            document.getElementById('dash-us').innerText = cUs;
            document.getElementById('dash-id').innerText = cId;
            document.getElementById('dash-banned').innerText = cBanned + ' Akun';
            document.getElementById('chart-total').innerText = total;
            
            const usPercentage = total === 0 ? 50 : (cUs / total) * 100;
            document.getElementById('region-chart').style.background = `conic-gradient(#2563EB 0%, #2563EB ${usPercentage}%, #34D399 ${usPercentage}%, #34D399 100%)`;
        }

        window.handleSearch = function() {
            const term = document.getElementById('search-vault').value.toLowerCase();
            const sort = document.getElementById('sort-vault').value;
            loadVaultData(term, sort, true); 
        }

        function renderVaultView() {
            return `
                <div class="page-enter px-6 pt-12 pb-6 flex flex-col h-full relative">
                    <div class="mb-6 flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-white">Brankas Akun</h2>
                        <button onclick="window.toggleSelectAll()" class="text-xs text-white/80 bg-white/20 px-3 py-1.5 rounded-full hover:bg-white/30 backdrop-blur-md transition-colors"><i class="ph-bold ph-check-square-offset mr-1"></i>Pilih Semua</button>
                    </div>
                    
                    <div class="glass-card flex-1 rounded-3xl p-4 sm:p-5 flex flex-col min-h-[450px]">
                        <div class="flex gap-2 mb-4">
                            <div class="relative flex-1">
                                <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="search-vault" onkeyup="window.handleSearch()" placeholder="Cari akun/niche..." class="w-full bg-slate-50/50 rounded-xl pl-9 pr-3 py-2.5 text-xs border border-slate-200 outline-none focus:border-brand-blue shadow-inner">
                            </div>
                            <select id="sort-vault" onchange="window.handleSearch()" class="bg-slate-50/50 rounded-xl px-2 py-2.5 text-xs border border-slate-200 outline-none focus:border-brand-blue shadow-inner text-slate-600">
                                <option value="newest">Terbaru</option>
                                <option value="oldest">Terlama</option>
                                <option value="az">A-Z</option>
                                <option value="inactive">Perlu Dicek</option>
                            </select>
                        </div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-slate-800 text-sm">Data Tersimpan</h3>
                            <span class="text-[10px] font-semibold text-brand-blue bg-blue-50 px-2 py-1 rounded-md" id="vault-count">Memuat...</span>
                        </div>
                        <div id="vault-list" class="flex-1 overflow-y-auto space-y-3 pb-24 pr-1">
                            <div class="flex justify-center items-center h-32"><i class="ph-bold ph-spinner animate-spin text-3xl text-brand-blue"></i></div>
                        </div>
                    </div>

                    <div id="bulk-action-bar" class="bulk-bar absolute bottom-24 left-6 right-6 bg-slate-900/95 backdrop-blur-md rounded-2xl p-3 flex justify-between items-center shadow-2xl border border-slate-700 z-[60] translate-y-[150%]">
                        <span class="text-white text-xs font-medium pl-2"><span id="bulk-count">0</span> Terpilih</span>
                        <div class="flex gap-2">
                            <button onclick="window.bulkMarkChecked()" class="bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-bold px-3 py-2 rounded-xl transition-colors"><i class="ph-bold ph-check-circle mr-1"></i>Dicek</button>
                            <button onclick="window.bulkDelete()" class="bg-red-500 hover:bg-red-600 text-white text-[10px] font-bold px-3 py-2 rounded-xl transition-colors"><i class="ph-bold ph-trash mr-1"></i>Hapus</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.toggleCheckbox = function(id) {
            if(selectedAccounts.has(id)) selectedAccounts.delete(id);
            else selectedAccounts.add(id);
            updateBulkBar();
            loadVaultData(document.getElementById('search-vault')?.value, document.getElementById('sort-vault')?.value, true); 
        }
        
        window.toggleSelectAll = async function() {
            const data = await fetchVaultData();
            if(selectedAccounts.size === data.length) selectedAccounts.clear();
            else data.forEach(item => selectedAccounts.add(item.id));
            updateBulkBar();
            loadVaultData(document.getElementById('search-vault')?.value, document.getElementById('sort-vault')?.value, true);
        }

        function updateBulkBar() {
            const bar = document.getElementById('bulk-action-bar');
            if(selectedAccounts.size > 0) {
                document.getElementById('bulk-count').innerText = selectedAccounts.size;
                bar.classList.remove('translate-y-[150%]');
            } else {
                bar.classList.add('translate-y-[150%]');
            }
        }

        window.bulkMarkChecked = async function() {
            for(let id of selectedAccounts) await updateVaultItem(id, { lastChecked: Date.now() });
            selectedAccounts.clear(); updateBulkBar(); showToast('Data ditandai dicek'); loadVaultData();
        }

        window.bulkDelete = function() {
            itemToDelete = Array.from(selectedAccounts);
            const modal = document.getElementById('delete-modal');
            const box = document.getElementById('delete-modal-box');
            modal.classList.remove('fallback-hidden');
            modal.style.display = 'flex';

        async function loadVaultData(searchTerm = '', sortBy = 'newest', retainSelection = false) {
            if(!retainSelection) { selectedAccounts.clear(); updateBulkBar(); }
            let data = await fetchVaultData();
            const msIn30Days = 30 * 24 * 60 * 60 * 1000;
            
            if (searchTerm) {
                data = data.filter(i => i.platform.toLowerCase().includes(searchTerm) || i.username.toLowerCase().includes(searchTerm) || (i.niche && i.niche.toLowerCase().includes(searchTerm)));
            }
            
            data.sort((a, b) => {
                if (sortBy === 'newest') return (b.createdAt || 0) - (a.createdAt || 0);
                if (sortBy === 'oldest') return (a.createdAt || 0) - (b.createdAt || 0);
                if (sortBy === 'az') return a.platform.localeCompare(b.platform);
                if (sortBy === 'inactive') {
                    let aInact = !a.lastChecked ? 9999999999999 : (Date.now() - a.lastChecked);
                    let bInact = !b.lastChecked ? 9999999999999 : (Date.now() - b.lastChecked);
                    return bInact - aInact; 
                }
                return 0;
            });

            const listEl = document.getElementById('vault-list');
            document.getElementById('vault-count').innerText = `${data.length} Item`;
            
            if (data.length === 0) {
                listEl.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-center opacity-60 pt-10"><i class="ph-fill ph-empty text-5xl text-slate-300 mb-3"></i><p class="text-sm font-medium text-slate-500">Belum ada data.</p></div>`;

            let html = '';

                const pwdId = `pwd-${item.id}`;

                let badges = `<span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-[8px] font-bold">${item.accountType || 'Baru'}</span>`;
                if(item.niche) badges += `<span class="bg-purple-100 text-purple-600 px-1.5 py-0.5 rounded text-[8px] font-bold"><i class="ph-bold ph-tag"></i> ${item.niche}</span>`;
                
                let statusColor = 'bg-emerald-400';
                if(item.status === 'Peringatan') statusColor = 'bg-yellow-400';
                if(item.status === 'Banned') statusColor = 'bg-red-500';

                let lastCheckedStr = item.lastChecked ? new Date(item.lastChecked).toLocaleDateString('id-ID', {day: 'numeric', month:'short'}) : 'Belum dicek';
                let regionIcon = item.region === 'US' ? '🇺🇸' : '🇮🇩';

                html += `
                    <div class="${isSelected ? 'bg-blue-50/50 border-brand-blue' : 'bg-slate-50 border-slate-100'} border rounded-2xl p-4 flex gap-3 transition-all relative overflow-hidden group">
                        <div class="absolute left-0 top-0 bottom-0 w-1 ${statusColor}"></div>
                        <div onclick="window.toggleCheckbox('${item.id}')" class="absolute left-2 top-4 w-5 h-5 rounded-md border-2 ${isSelected ? 'bg-brand-blue border-brand-blue' : 'border-slate-300 bg-white group-hover:border-brand-blue'} flex items-center justify-center cursor-pointer transition-colors z-10">
                            ${isSelected ? '<i class="ph-bold ph-check text-white text-xs"></i>' : ''}
                        </div>
                        
                        <div class="w-10 h-10 rounded-xl bg-white shadow-sm flex items-center justify-center flex-shrink-0 text-2xl border border-slate-100 ml-5 relative">
                            ${regionIcon}
                            ${isInactive ? '<div class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white animate-pulse" title="Tidak aktif >30 Hari"></div>' : ''}
                        </div>
                        
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-slate-800 text-sm truncate flex items-center gap-1.5">${item.platform} ${badges}</h4>
                            <div class="flex items-center gap-1 mt-0.5">
                                <p class="text-[11px] text-slate-500 truncate">${item.username}</p>
                                <button onclick="window.copyToClip('${item.username}', 'Username')" class="text-slate-400 hover:text-brand-blue ml-1"><i class="ph-bold ph-copy text-[10px]"></i></button>
                            </div>
                            ${item.notes ? `<p class="text-[9px] text-slate-400 truncate italic mt-1"><i class="ph-bold ph-info"></i> ${item.notes}</p>` : ''}
                            
                            <div class="flex items-center gap-2 mt-2 bg-white px-2 py-1 rounded-lg border border-slate-100 w-max relative z-10">
                                <input type="password" id="${pwdId}" value="${item.password}" class="bg-transparent border-none text-[11px] text-slate-700 font-mono w-16 outline-none pointer-events-none" readonly>
                                <button onclick="window.togglePass('${pwdId}')" class="text-slate-400 hover:text-brand-blue"><i class="ph-bold ph-eye text-xs"></i></button>
                                <button onclick="window.copyToClip('${item.password}', 'Password')" class="text-slate-400 hover:text-brand-teal"><i class="ph-bold ph-copy text-xs"></i></button>
                            </div>
                            
                            <div class="mt-2 flex items-center justify-between">

                            </div>
                        </div>
                        
                        <div class="flex flex-col gap-1.5 ml-1 pl-2 relative z-10">

                            <button onclick="window.delVault('${item.id}')" class="w-7 h-7 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100"><i class="ph-bold ph-trash text-xs"></i></button>
                        </div>

            listEl.innerHTML = html;
        }

            const res = await updateVaultItem(id, { lastChecked: Date.now() });
            if(res) { showToast('Waktu pengecekan diperbarui'); loadVaultData(); }
        }

        }

        window.copyToClip = function(text, label) {
            try {
                const el = document.createElement('textarea'); el.value = text;
                document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
                showToast(`${label} disalin`);

        }
        
        let itemToDelete = [];

        window.genPass = function() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
            let pwd = ""; for (let i = 0; i < 12; i++) pwd += chars.charAt(Math.floor(Math.random() * chars.length));
            const input = document.getElementById('add-password');
            input.value = pwd; input.type = 'text';
            input.nextElementSibling.querySelector('i').classList.replace('ph-eye', 'ph-eye-slash'); window.evalPass();
        }

        window.evalPass = function() {
            const val = document.getElementById('add-password').value;
            const bar = document.getElementById('pw-strength-bar');
            if (!val) { bar.style.width = '0%'; return; }
            let s = 0; if(val.length >= 8) s++; if(/[A-Z]/.test(val)) s++; if(/[0-9]/.test(val)) s++; if(/[^A-Za-z0-9]/.test(val)) s++;
            if (s < 2) { bar.style.width = '33%'; bar.className = 'h-full bg-red-500'; }
            else if (s < 4) { bar.style.width = '66%'; bar.className = 'h-full bg-yellow-400'; }
            else { bar.style.width = '100%'; bar.className = 'h-full bg-emerald-500'; }
        }

        window.handleSave = async function() {
            const payload = {
                platform: document.getElementById('add-platform').value.trim(),
                region: document.getElementById('add-region').value,
                accountType: document.getElementById('add-type').value,
                niche: document.getElementById('add-niche').value.trim(),
                status: document.getElementById('add-status').value,
                username: document.getElementById('add-username').value.trim(),
                password: document.getElementById('add-password').value.trim(),
                notes: document.getElementById('add-notes').value.trim()
            };
            
            if(!payload.platform || !payload.username || !payload.password) { showToast('Isi kolom wajib', 'error'); return; }
            
            document.getElementById('btn-save').innerHTML = `<i class="ph-bold ph-spinner animate-spin text-xl"></i>`;
            const isEdit = currentRoute === 'edit';
            const res = isEdit ? await updateVaultItem(currentEditItem.id, payload) : await addVaultItem(payload);
            
            if(res) { showToast(isEdit ? 'Diperbarui' : 'Tersimpan'); setTimeout(() => navigate('vault'), 800); } 
            else { showToast('Gagal', 'error'); document.getElementById('btn-save').innerText = 'Coba Lagi'; }
        }

        // --- PERBAIKAN SISTEM BACKUP MENGGUNAKAN METODE BLOB ---
        window.exportData = async function(format) {
            try {
                const data = await fetchVaultData();
                if(!data || data.length === 0) { showToast('Tidak ada data untuk dibackup', 'error'); return; }
                
                let content, mime, filename;
                const cleanData = data.map(({ id, ...rest }) => rest);

                if(format === 'json') {
                    content = JSON.stringify(cleanData, null, 2);
                    mime = "application/json";
                    filename = `warzt_backup_${Date.now()}.json`;
                } else if (format === 'csv') {
                    const headers = ['Platform', 'Region', 'Tipe', 'Niche', 'Status', 'Username', 'Password', 'Catatan'];
                    const rows = cleanData.map(d => [d.platform, d.region, d.accountType, d.niche || '-', d.status, d.username, d.password, `"${(d.notes || '').replace(/"/g, '""')}"`]);
                    content = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                    mime = "text/csv";
                    filename = `warzt_backup_${Date.now()}.csv`;
                }

                // Menggunakan teknik Blob agar kompatibel di semua HP dan WebView
                const blob = new Blob([content], { type: mime });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
                
                showToast(`Berhasil diekspor ke format ${format.toUpperCase()}`);
            } catch (error) {
                console.error("Kesalahan proses export:", error);
                showToast('Gagal melakukan pencadangan', 'error');
            }
        }

        window.triggerImport = function() { document.getElementById('import-file').click(); }
        window.handleImport = function(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if(Array.isArray(importedData)) {
                        document.getElementById('import-file').value = ''; // Reset input
                        showToast('Sedang memulihkan data... Mohon tunggu');
                        
                        let count = 0;
                        for(const item of importedData) { await addVaultItem(item); count++; }
                        
                        showToast(`${count} akun berhasil dipulihkan!`);
                        if (currentRoute === 'vault') loadVaultData(); // Refresh daftar otomatis
                    } else {
                        showToast('Format JSON salah atau korup', 'error');
                    }
                } catch(err) { showToast('File bukan format JSON yang valid', 'error'); }
            };
            reader.readAsText(file);
        }

                                <button onclick="window.exportData('csv')" class="flex-1 bg-white text-slate-700 rounded-xl py-3 font-semibold shadow-sm border border-slate-200 hover:bg-slate-50 text-xs flex justify-center items-center gap-1"><i class="ph-bold ph-file-csv text-sm"></i> CSV (Excel)</button>

                        </div>
                    </div>
                </div>
            `;
        }
        
        window.handleLogout = function() { currentUser = null; showToast('Brankas terkunci'); navigate('login'); }
        window.onload = () => { render(); }
    </script>
</body>
</html>
