<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>warzt Data</title>
    
    <!-- Memuat Font dan Ikon -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: { 
                            primary: '#881337',   // Rose 900
                            secondary: '#be123c', // Rose 700
                            dark: '#4c0519',      // Rose 950
                            light: '#fff1f2',     // Rose 50
                            bg: '#fdfafb'         // Very light pink/white
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- CSS Tambahan & Pengaman -->
    <style>
        /* Perbaikan Tinggi Layar Mobile (100dvh) */
        html, body { height: 100%; height: 100dvh; }
        body { -webkit-tap-highlight-color: transparent; background-color: #fdfafb; margin: 0; font-family: 'Poppins', sans-serif; }
        
        .fallback-hidden { display: none !important; }
        
        /* Area Aman (Safe Area) untuk iPhone / Android Gesture Bar - Dibuat lebih ringkas */
        .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
        
        /* Efek Kaca Premium */
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 1); box-shadow: 0 15px 35px rgba(136, 19, 55, 0.05); }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 -10px 40px rgba(76, 5, 25, 0.04); }
        
        /* Ornamen Latar Belakang Burgundy */
        .gradient-bg { background: linear-gradient(135deg, #4c0519 0%, #be123c 100%); }
        .blob-1 { position: absolute; top: 0; left: 0; width: 100%; height: 40%; background: linear-gradient(135deg, #4c0519 0%, #881337 100%); border-radius: 0 0 35% 35%; z-index: 0; }
        .blob-2 { position: absolute; bottom: -10%; right: -20%; width: 80%; height: 50%; background: radial-gradient(circle, rgba(190,18,60,0.08) 0%, rgba(136,19,55,0) 70%); z-index: 0; }
        
        /* Animasi Transisi */
        .page-enter { animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .donut-chart { border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
        .donut-inner { width: 75%; height: 75%; background-color: #ffffff; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .bulk-bar { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        /* GHOST MODE BLUR */
        .ghost-active .sensitive-data { filter: blur(5px); user-select: none; transition: filter 0.3s ease; }
        .ghost-active .sensitive-data:hover { filter: blur(0px); } /* Mengintip saat ditahan/hover */
    </style>
</head>
<body class="text-slate-800 flex justify-center h-[100dvh] overflow-hidden" id="main-body">

    <!-- Kontainer Utama dengan Tinggi 100dvh Penuh -->
    <div id="app-container" class="w-full max-w-md h-[100dvh] relative bg-brand-bg overflow-hidden shadow-2xl flex flex-col">
        <div id="bg-blob-1" class="blob-1 transition-all duration-700 ease-in-out"></div>
        <div id="bg-blob-2" class="blob-2"></div>
        
        <!-- Jarak Bawah Disesuaikan agar tidak terpotong (pb-28) -->
        <main id="app-content" class="relative z-10 w-full flex-1 overflow-y-auto overflow-x-hidden pb-28"></main>

        <!-- Menu Navigasi Bawah - Dibuat Lebih Ringkas -->
        <nav id="bottom-nav" class="fallback-hidden glass-nav absolute bottom-0 w-full rounded-t-3xl px-6 pt-3 pb-safe flex justify-between items-center z-50 transition-transform duration-500 translate-y-[150%]">
            <button onclick="navigate('dashboard')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-brand-primary transition-colors" data-target="dashboard"><i class="ph-fill ph-squares-four text-xl"></i></button>
            <button onclick="navigate('vault')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-brand-primary transition-colors" data-target="vault"><i class="ph-fill ph-shield-check text-xl"></i></button>
            <button onclick="navigate('add')" class="nav-btn flex flex-col items-center gap-1 -mt-6 transition-transform hover:scale-105 active:scale-95" data-target="add">
                <div class="w-12 h-12 rounded-full gradient-bg flex items-center justify-center text-white shadow-lg shadow-brand-primary/30 border-[3px] border-white"><i class="ph-bold ph-plus text-xl"></i></div>
            </button>
            <button onclick="navigate('profile')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-brand-primary transition-colors" data-target="profile"><i class="ph-fill ph-user text-xl"></i></button>
        </nav>
        
        <div id="toast-container" class="absolute top-4 left-1/2 -translate-x-1/2 z-[100] w-[90%] pointer-events-none"></div>
        
        <!-- Modal Ubah PIN -->
        <div id="pin-modal" class="fallback-hidden fixed inset-0 z-[200] flex items-center justify-center p-4" style="display: none;">
            <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="window.closePinModal()"></div>
            <div class="bg-white rounded-3xl p-5 relative z-10 w-[85%] max-w-sm shadow-2xl transform transition-transform scale-95 opacity-0 duration-200" id="pin-modal-box">
                <div class="w-12 h-12 bg-brand-light border border-brand-secondary/20 rounded-full flex items-center justify-center text-brand-primary mx-auto mb-3"><i class="ph-bold ph-lock-key text-2xl"></i></div>
                <h3 class="text-base font-bold text-center text-slate-800 mb-1">Ubah Master PIN</h3>
                <p class="text-[11px] text-center text-slate-500 mb-4">PIN ini disimpan di HP Anda.</p>
                <div class="space-y-3 mb-5">
                    <input type="password" id="old-pin" placeholder="PIN Lama" class="w-full bg-slate-50 rounded-xl px-4 py-2.5 text-sm text-center font-bold tracking-widest outline-none border border-slate-200 focus:border-brand-primary">
                    <input type="password" id="new-pin" placeholder="PIN Baru (Min. 4 Angka)" class="w-full bg-slate-50 rounded-xl px-4 py-2.5 text-sm text-center font-bold tracking-widest outline-none border border-slate-200 focus:border-brand-primary">
                </div>
                <div class="flex gap-2.5">
                    <button onclick="window.closePinModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-2.5 rounded-xl hover:bg-slate-200 transition-colors text-xs">Batal</button>
                    <button onclick="window.saveNewPin()" class="flex-1 bg-brand-primary text-white font-semibold py-2.5 rounded-xl hover:bg-brand-secondary transition-colors shadow-lg shadow-brand-primary/30 text-xs">Simpan</button>
                </div>
            </div>
        </div>

        <!-- Modal Hapus -->
        <div id="delete-modal" class="fallback-hidden fixed inset-0 z-[200] flex items-center justify-center p-4" style="display: none;">
            <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="window.closeModal()"></div>
            <div class="bg-white rounded-3xl p-5 relative z-10 w-[85%] max-w-sm shadow-2xl transform transition-transform scale-95 opacity-0 duration-200" id="delete-modal-box">
                <div class="w-12 h-12 bg-red-50 border border-red-100 rounded-full flex items-center justify-center text-red-500 mx-auto mb-3"><i class="ph-bold ph-trash text-2xl"></i></div>
                <h3 class="text-base font-bold text-center text-slate-800 mb-1">Hapus Akun?</h3>
                <p class="text-[11px] text-center text-slate-500 mb-5">Data yang dihapus tidak dapat dikembalikan. Anda yakin?</p>
                <div class="flex gap-2.5">
                    <button onclick="window.closeModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-2.5 rounded-xl hover:bg-slate-200 transition-colors text-xs">Batal</button>
                    <button onclick="window.confirmDelete()" class="flex-1 bg-red-500 text-white font-semibold py-2.5 rounded-xl hover:bg-red-600 transition-colors shadow-lg shadow-red-500/30 text-xs">Ya, Hapus</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PWA & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. KONFIGURASI APLIKASI
        // ==========================================
        const ID_PEMILIK = "warzt_admin_vault_1"; 

        const firebaseConfig = {
          apiKey: "AIzaSyDUqieIsgcStR3BX1kaRrRsMgbJJd7cSTQ",
          authDomain: "warztdata.firebaseapp.com",
          projectId: "warztdata",
          storageBucket: "warztdata.firebasestorage.app",
          messagingSenderId: "541850398487",
          appId: "1:541850398487:web:ae836ab8a9cbce79fc9152",
          measurementId: "G-GKN03LTD3H"
        };
        const appId = 'warzt-data';
        
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch(e) {
            console.error("Firebase Gagal Dimuat:", e);
        }

        // ==========================================
        // 2. STATE MANAGEMENT & AUTO-LOCK
        // ==========================================
        let currentUser = null;
        let currentRoute = 'login';
        let currentEditItem = null;
        let selectedAccounts = new Set();
        let isGhostMode = false; // Fitur Penyamaran
        
        let idleTime = 0;
        function resetIdleTimer() { idleTime = 0; }
        document.body.addEventListener('mousemove', resetIdleTimer);
        document.body.addEventListener('keypress', resetIdleTimer);
        document.body.addEventListener('touchstart', resetIdleTimer);
        
        setInterval(() => {
            if(currentUser && currentRoute !== 'login') {
                idleTime++;
                if (idleTime >= 180) { window.handleLogout(); showToast('Terkunci Otomatis (3 Menit Inaktif)', 'error'); }
            }
        }, 1000);

        // Ambil PIN Kustom dari Memori HP (Default 123456)
        const getMasterPin = () => localStorage.getItem('warzt_master_pin') || '123456';

        // ==========================================
        // 3. CORE LOGIC
        // ==========================================
        const appContent = document.getElementById('app-content');
        const bottomNav = document.getElementById('bottom-nav');
        const mainBody = document.getElementById('main-body');
        
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
            toast.className = `${bgColor} text-white px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2.5 transform transition-all duration-300 translate-y-[-100%] opacity-0 mb-2`;
            toast.innerHTML = `<i class="ph-bold ${type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'} text-lg"></i><span class="text-[13px] font-medium">${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('translate-y-[-100%]', 'opacity-0'); }, 10);
            setTimeout(() => { toast.classList.add('translate-y-[-100%]', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function fetchVaultData() {
            if (!currentUser || !db) return [];
            try {
                const vaultCol = collection(db, 'artifacts', appId, 'private_data', ID_PEMILIK, 'vault_items');
                const vaultSnapshot = await getDocs(vaultCol);
                const items = [];
                vaultSnapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                return items;
            } catch (error) { 
                showToast('Gagal memuat data. Cek koneksi.', 'error');
                return []; 
            }
        }

        async function addVaultItem(data) {
            const newItem = { ...data, createdAt: Date.now(), lastChecked: null };
            try {
                const vaultCol = collection(db, 'artifacts', appId, 'private_data', ID_PEMILIK, 'vault_items');
                await addDoc(vaultCol, newItem); return true;
            } catch (error) { return false; }
        }

        async function updateVaultItem(id, data) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'private_data', ID_PEMILIK, 'vault_items', id);
                await updateDoc(docRef, data); return true;
            } catch(e) { return false; }
        }
        
        async function deleteVaultItem(id) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'private_data', ID_PEMILIK, 'vault_items', id);
                await deleteDoc(docRef); return true;
            } catch(e) { return false; }
        }

        window.navigate = function(route) {
            resetIdleTimer();
            if(route !== 'edit') currentEditItem = null; 
            selectedAccounts.clear();
            currentRoute = route; render();
        }

        window.toggleGhostMode = function() {
            isGhostMode = !isGhostMode;
            if(isGhostMode) {
                mainBody.classList.add('ghost-active');
                showToast('Mode Penyamaran Aktif');
            } else {
                mainBody.classList.remove('ghost-active');
                showToast('Mode Penyamaran Nonaktif');
            }
            render(); // Segarkan tampilan ikon
        }

        function adjustBackground(route) {
            const blob1 = document.getElementById('bg-blob-1');
            if(route === 'login') {
                blob1.style.height = '100%'; blob1.style.borderRadius = '0'; 
                blob1.style.background = 'linear-gradient(135deg, #fdfafb 0%, #fff1f2 100%)';
                bottomNav.classList.add('translate-y-[150%]');
                bottomNav.classList.add('fallback-hidden');
            } else {
                blob1.style.height = '35%'; blob1.style.borderRadius = '0 0 35% 35%'; 
                blob1.style.background = 'linear-gradient(135deg, #4c0519 0%, #881337 100%)';
                bottomNav.classList.remove('fallback-hidden');
                bottomNav.style.display = 'flex';
                bottomNav.classList.remove('translate-y-[150%]');
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if(btn.dataset.target === route && !['add', 'edit'].includes(route)) {
                        btn.classList.add('text-brand-primary'); btn.classList.remove('text-slate-400');
                    } else if (!['add', 'edit'].includes(route)) {
                        btn.classList.remove('text-brand-primary'); btn.classList.add('text-slate-400');
                    }
                });
            }
        }

        function render() {
            adjustBackground(currentRoute);
            let html = '';
            if (currentRoute === 'login') html = renderLoginView();
            else if (currentRoute === 'dashboard') html = renderDashboardView();
            else if (currentRoute === 'vault') html = renderVaultView();
            else if (currentRoute === 'add' || currentRoute === 'edit') html = renderAddEditView();
            else if (currentRoute === 'profile') html = renderProfileView();
            
            appContent.innerHTML = html;
            if (currentRoute === 'dashboard') loadDashboardData();
            if (currentRoute === 'vault') loadVaultData();
        }

        // --- VIEWS ---
        function renderLoginView() {
            return `
                <div class="page-enter flex flex-col items-center justify-center min-h-screen px-6 py-10 z-10 relative">
                    <div class="mb-8 text-center relative">
                        <!-- Icon diperkecil sedikit -->
                        <div class="w-20 h-20 bg-gradient-to-br from-brand-primary to-brand-dark rounded-2xl flex items-center justify-center shadow-xl shadow-brand-primary/40 mx-auto mb-5 border border-white/20 transform rotate-3">
                            <i class="ph-fill ph-shield-check text-4xl text-white transform -rotate-3"></i>
                        </div>
                        <h1 class="text-3xl font-bold text-slate-800 tracking-tight mb-1.5">warzt<span class="text-brand-primary">Data</span></h1>
                        <p class="text-slate-500 text-xs font-medium">Personal Secure Vault</p>
                    </div>
                    <!-- Form Login diperkecil -->
                    <div class="glass-card w-full max-w-sm rounded-[1.5rem] p-5 sm:p-6 mt-2 shadow-xl border border-white/60">
                        <div class="space-y-4">
                            <div class="relative">
                                <i class="ph-bold ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="password" id="login-pin" placeholder="Master PIN" class="w-full bg-slate-50/50 rounded-xl pl-10 pr-10 py-3 text-sm text-slate-800 font-medium outline-none border border-slate-200 focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/10 transition-all shadow-sm">
                                <button onclick="window.togglePass('login-pin')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-primary"><i class="ph-bold ph-eye"></i></button>
                            </div>
                            <button onclick="window.handleLogin()" id="btn-login" class="w-full bg-gradient-to-r from-brand-dark to-brand-primary text-white rounded-xl py-3.5 text-sm font-semibold shadow-lg shadow-brand-primary/30 hover:shadow-xl active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                                <span>Buka Brankas</span><i class="ph-bold ph-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.togglePass = function(id) {
            const input = document.getElementById(id);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === "password") { input.type = "text"; icon.classList.replace('ph-eye', 'ph-eye-slash'); } 
            else { input.type = "password"; icon.classList.replace('ph-eye-slash', 'ph-eye'); }
        }

        window.handleLogin = async function() {
            const pin = document.getElementById('login-pin').value.trim();
            if(!pin) { showToast('Harap masukkan PIN', 'error'); return; }
            
            if (window.location.protocol === 'file:' || window.location.protocol === 'content:') {
                showToast("Akses Ditolak! Wajib upload ke GitHub/Vercel.", 'error');
                return;
            }

            document.getElementById('btn-login').innerHTML = `<i class="ph-bold ph-spinner animate-spin text-lg"></i>`;
            
            try {
                if(!auth) throw new Error("Koneksi Firebase gagal.");
                await signInAnonymously(auth); 
                
                if(pin === getMasterPin()) { currentUser = { id: ID_PEMILIK }; navigate('dashboard'); }
                else { throw new Error("PIN Salah"); }
            } catch(e) { 
                console.error(e);
                showToast(e.message, 'error'); 
                document.getElementById('btn-login').innerHTML = `<span>Buka Brankas</span><i class="ph-bold ph-arrow-right"></i>`; 
            }
        }

        function renderDashboardView() {
            const ghostIcon = isGhostMode ? 'ph-ghost ph-fill text-brand-primary' : 'ph-eye ph-fill text-slate-400';
            return `
                <div class="page-enter px-5 pt-10 pb-6">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <p class="text-white/80 text-[11px] font-medium">Good morning,</p>
                            <h2 class="text-xl font-bold text-white flex items-center gap-1.5">Owner <span class="text-lg">👋</span></h2>
                        </div>
                        <!-- Tombol Atas Diperkecil -->
                        <div class="flex gap-2">
                            <button onclick="window.toggleGhostMode()" class="w-10 h-10 bg-white/10 backdrop-blur-md rounded-full border border-white/20 flex items-center justify-center hover:bg-white/20 shadow-lg transition-colors" title="Mode Penyamaran">
                                <i class="${ghostIcon} text-lg ${isGhostMode ? 'text-white' : 'text-white'}"></i>
                            </button>
                            <div class="w-10 h-10 bg-white/10 backdrop-blur-md rounded-full border border-white/20 flex items-center justify-center text-white shadow-lg">
                                <i class="ph-fill ph-bell text-lg"></i>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Kotak Data Diperkecil -->
                    <div class="bg-gradient-to-br from-brand-dark to-brand-primary rounded-[1.5rem] p-5 shadow-xl shadow-brand-dark/20 border border-white/10 flex items-center gap-5 mb-5 hover:shadow-2xl transition-all">
                        <div id="region-chart" class="donut-chart w-20 h-20 shadow-inner" style="background: conic-gradient(#fff 0%, #fff 50%, #f43f5e 50%, #f43f5e 100%);">
                            <div class="donut-inner shadow-sm bg-brand-primary"><span class="text-[9px] text-white/70">Total</span><span id="chart-total" class="text-lg font-bold text-white leading-none mt-0.5">0</span></div>
                        </div>
                        <div class="flex-1 space-y-2.5">
                            <div class="flex justify-between items-center bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">
                                <div class="flex items-center gap-1.5"><span class="text-xs">🇺🇸</span><span class="text-[11px] text-white/90 font-medium">Akun US</span></div>
                                <span class="text-xs font-bold text-white" id="dash-us">-</span>
                            </div>
                            <div class="flex justify-between items-center bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">
                                <div class="flex items-center gap-1.5"><span class="text-xs">🇮🇩</span><span class="text-[11px] text-white/90 font-medium">Akun Indo</span></div>
                                <span class="text-xs font-bold text-white" id="dash-id">-</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-[1.5rem] p-4 shadow-lg shadow-brand-dark/5 border border-brand-light flex items-center gap-3 relative overflow-hidden group">
                        <div class="absolute right-0 top-0 w-24 h-24 bg-red-50 rounded-full blur-2xl -z-0"></div>
                        <div class="w-10 h-10 bg-red-100/50 rounded-xl flex items-center justify-center text-red-500 relative z-10 group-hover:scale-110 transition-transform"><i class="ph-fill ph-warning-octagon text-xl"></i></div>
                        <div class="relative z-10 flex-1">
                            <p class="text-[10px] text-slate-500 font-medium mb-0.5">Security Alerts</p>
                            <h4 class="text-sm font-bold text-slate-800" id="dash-banned">0 Bermasalah</h4>
                        </div>
                        <i class="ph-bold ph-caret-right text-slate-300 relative z-10 text-sm"></i>
                    </div>
                </div>
            `;
        }

        async function loadDashboardData() {
            const data = await fetchVaultData();
            let cUs = 0, cId = 0, cBanned = 0;
            data.forEach(item => {
                if(item.region === 'US') cUs++;
                if(item.region === 'Indo') cId++;
                if(item.status === 'Banned' || item.status === 'Peringatan') cBanned++;
            });
            const total = cUs + cId;
            document.getElementById('dash-us').innerText = cUs;
            document.getElementById('dash-id').innerText = cId;
            document.getElementById('dash-banned').innerText = cBanned + ' Akun';
            document.getElementById('chart-total').innerText = total;
            
            const usPercentage = total === 0 ? 50 : (cUs / total) * 100;
            document.getElementById('region-chart').style.background = `conic-gradient(#ffffff 0%, #ffffff ${usPercentage}%, #fda4af ${usPercentage}%, #fda4af 100%)`;
        }

        window.handleSearch = function() {
            const term = document.getElementById('search-vault')?.value.toLowerCase() || '';
            const sort = document.getElementById('sort-vault')?.value || 'newest';
            loadVaultData(term, sort, true); 
        }

        function renderVaultView() {

        async function loadVaultData(searchTerm = '', sortBy = 'newest', retainSelection = false) {
            if(!retainSelection) { selectedAccounts.clear(); updateBulkBar(); }
            let data = await fetchVaultData();
            const msIn30Days = 30 * 24 * 60 * 60 * 1000;
            
            if (searchTerm) {
                data = data.filter(i => i.platform.toLowerCase().includes(searchTerm) || i.username.toLowerCase().includes(searchTerm) || (i.niche && i.niche.toLowerCase().includes(searchTerm)));
            }
            
            data.sort((a, b) => {
                if (sortBy === 'newest') return (b.createdAt || 0) - (a.createdAt || 0);
                if (sortBy === 'oldest') return (a.createdAt || 0) - (b.createdAt || 0);
                if (sortBy === 'az') return a.platform.localeCompare(b.platform);
                if (sortBy === 'inactive') {
                    let aInact = !a.lastChecked ? 9999999999999 : (Date.now() - a.lastChecked);
                    let bInact = !b.lastChecked ? 9999999999999 : (Date.now() - b.lastChecked);
                    return bInact - aInact; 
                }
                return 0;
            });

            const listEl = document.getElementById('vault-list');
            document.getElementById('vault-count').innerText = `${data.length} Item`;
            
            if (data.length === 0) {
                listEl.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-center opacity-60 pt-10"><i class="ph-fill ph-empty text-4xl text-slate-300 mb-2"></i><p class="text-xs font-medium text-slate-500">Belum ada data.</p></div>`;
                return;
            }
            
            let html = '';
            data.forEach((item) => {
                const pwdId = `pwd-${item.id}`;
                const isSelected = selectedAccounts.has(item.id);
                const isInactive = !item.lastChecked || (Date.now() - item.lastChecked > msIn30Days);
                
                let badges = `<span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-[7px] font-bold">${item.accountType || 'Baru'}</span>`;
                if(item.niche) badges += `<span class="bg-brand-light text-brand-primary px-1.5 py-0.5 rounded text-[7px] font-bold"><i class="ph-bold ph-tag"></i> ${item.niche}</span>`;
                if(item.ipProxy) badges += `<span class="bg-blue-50 text-blue-500 px-1.5 py-0.5 rounded text-[7px] font-bold"><i class="ph-bold ph-globe"></i> IP Proxy</span>`;
                
                let statusColor = 'bg-emerald-400';
                if(item.status === 'Peringatan') statusColor = 'bg-yellow-400';
                if(item.status === 'Banned') statusColor = 'bg-red-500';

                let lastCheckedStr = item.lastChecked ? new Date(item.lastChecked).toLocaleDateString('id-ID', {day: 'numeric', month:'short'}) : 'Belum dicek';
                let regionIcon = item.region === 'US' ? '🇺🇸' : '🇮🇩';

                html += `
                    <div class="${isSelected ? 'bg-brand-light border-brand-secondary/30 shadow-md' : 'bg-white border-slate-100 hover:border-slate-200 shadow-sm'} border rounded-[1rem] p-3 flex gap-3 transition-all relative overflow-hidden group">
                        <div class="absolute left-0 top-0 bottom-0 w-[3px] ${statusColor}"></div>
                        <div onclick="window.toggleCheckbox('${item.id}')" class="absolute left-1.5 top-3.5 w-4 h-4 rounded-[4px] border-2 ${isSelected ? 'bg-brand-primary border-brand-primary' : 'border-slate-300 bg-white group-hover:border-brand-primary'} flex items-center justify-center cursor-pointer transition-colors z-10">
                            ${isSelected ? '<i class="ph-bold ph-check text-white text-[9px]"></i>' : ''}
                        </div>
                        
                        <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center flex-shrink-0 text-xl border border-slate-100 ml-4 relative">
                            ${regionIcon}
                            ${isInactive ? '<div class="absolute top-0 right-0 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white animate-pulse" title="Tidak aktif >30 Hari"></div>' : ''}
                        </div>
                        
                        <div class="flex-1 min-w-0 py-0.5">
                            <h4 class="font-bold text-slate-800 text-[13px] truncate flex items-center gap-1">${item.platform} ${badges}</h4>
                            <div class="flex items-center gap-1 mt-0.5">
                                <p class="text-[11px] text-slate-500 truncate font-medium sensitive-data">${item.username}</p>
                                <button onclick="window.copyToClip('${item.username}', 'Username')" class="text-slate-400 hover:text-brand-primary ml-0.5 transition-colors"><i class="ph-bold ph-copy text-[10px]"></i></button>
                            </div>
                            
                            ${item.notes ? `<p class="text-[9px] text-slate-400 truncate mt-1 bg-slate-50 px-2 py-0.5 rounded inline-block sensitive-data"><i class="ph-bold ph-info"></i> ${item.notes}</p>` : ''}
                            
                            <div class="flex items-center gap-1.5 mt-2 bg-slate-50 px-2 py-1 rounded-lg border border-slate-100 w-max relative z-10 hover:border-brand-light hover:bg-brand-bg transition-colors">
                                <input type="password" id="${pwdId}" value="${item.password}" class="bg-transparent border-none text-[10px] text-slate-700 font-mono w-14 outline-none pointer-events-none sensitive-data" readonly>

                                <button onclick="window.copyToClip('${item.password}', 'Password')" class="text-slate-400 hover:text-brand-primary transition-colors ml-0.5"><i class="ph-bold ph-copy text-[11px]"></i></button>
                            </div>

                                <button onclick="window.markChecked('${item.id}')" class="text-[8px] font-bold text-brand-primary bg-brand-light px-2.5 py-0.5 rounded-full hover:bg-brand-primary hover:text-white transition-colors relative z-10 shadow-sm">Mark Safe</button>
                            </div>
                        </div>
                        
                        <div class="flex flex-col justify-center gap-1.5 ml-1 pl-1.5 relative z-10 border-l border-slate-100">
                            <button onclick="window.openEdit('${item.id}')" class="w-7 h-7 rounded-full bg-slate-50 text-slate-500 flex items-center justify-center hover:bg-brand-light hover:text-brand-primary transition-colors"><i class="ph-bold ph-pencil-simple text-xs"></i></button>
                            <button onclick="window.delVault('${item.id}')" class="w-7 h-7 rounded-full bg-slate-50 text-slate-500 flex items-center justify-center hover:bg-red-50 hover:text-red-500 transition-colors"><i class="ph-bold ph-trash text-xs"></i></button>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        window.genPass = function() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
            let pwd = ""; for (let i = 0; i < 12; i++) pwd += chars.charAt(Math.floor(Math.random() * chars.length));
            const input = document.getElementById('add-password');
            input.value = pwd; input.type = 'text';
            input.nextElementSibling.querySelector('i').classList.replace('ph-eye', 'ph-eye-slash'); window.evalPass();
        }

        window.evalPass = function() {
            const val = document.getElementById('add-password').value;
            const bar = document.getElementById('pw-strength-bar');
            if (!val) { bar.style.width = '0%'; return; }
            let s = 0; if(val.length >= 8) s++; if(/[A-Z]/.test(val)) s++; if(/[0-9]/.test(val)) s++; if(/[^A-Za-z0-9]/.test(val)) s++;
            if (s < 2) { bar.style.width = '33%'; bar.className = 'h-full bg-red-500 transition-all'; }
            else if (s < 4) { bar.style.width = '66%'; bar.className = 'h-full bg-yellow-400 transition-all'; }
            else { bar.style.width = '100%'; bar.className = 'h-full bg-emerald-500 transition-all'; }
        }

        window.handleSave = async function() {
            const payload = {
                platform: document.getElementById('add-platform').value.trim(),
                region: document.getElementById('add-region').value,
                accountType: document.getElementById('add-type').value,
                niche: document.getElementById('add-niche').value.trim(),
                status: document.getElementById('add-status').value,
                username: document.getElementById('add-username').value.trim(),
                password: document.getElementById('add-password').value.trim(),
                ipProxy: document.getElementById('add-ip').value.trim(),
                twoFactor: document.getElementById('add-2fa').value.trim(),
                notes: document.getElementById('add-notes').value.trim()
            };
            
            if(!payload.platform || !payload.username || !payload.password) { showToast('Isi nama, username, password', 'error'); return; }
            
            document.getElementById('btn-save').innerHTML = `<i class="ph-bold ph-spinner animate-spin text-lg"></i>`;
            const isEdit = currentRoute === 'edit';
            const res = isEdit ? await updateVaultItem(currentEditItem.id, payload) : await addVaultItem(payload);
            
            if(res) { showToast(isEdit ? 'Diperbarui' : 'Tersimpan'); setTimeout(() => navigate('vault'), 800); } 
            else { showToast('Gagal', 'error'); document.getElementById('btn-save').innerText = 'Coba Lagi'; }
        }

        window.exportData = async function(format) {
            try {
                const data = await fetchVaultData();
                if(!data || data.length === 0) { showToast('Tidak ada data untuk dibackup', 'error'); return; }
                
                let content, mime, filename;
                const cleanData = data.map(({ id, ...rest }) => rest);

                if(format === 'json') {
                    content = JSON.stringify(cleanData, null, 2);
                    mime = "application/json";
                    filename = `warzt_backup_${Date.now()}.json`;
                } else if (format === 'csv') {
                    const headers = ['Platform', 'Region', 'Tipe', 'Niche', 'Status', 'Username', 'Password', 'Proxy', '2FA', 'Catatan'];
                    const rows = cleanData.map(d => [d.platform, d.region, d.accountType, d.niche || '-', d.status, d.username, d.password, d.ipProxy || '-', d.twoFactor || '-', `"${(d.notes || '').replace(/"/g, '""')}"`]);
                    content = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                    mime = "text/csv";
                    filename = `warzt_backup_${Date.now()}.csv`;
                }

                const blob = new Blob([content], { type: mime });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
                
                showToast(`Berhasil diekspor ke format ${format.toUpperCase()}`);
            } catch (error) {
                console.error("Kesalahan proses export:", error);
                showToast('Gagal melakukan pencadangan', 'error');
            }
        }

        window.triggerImport = function() { document.getElementById('import-file').click(); }
        window.handleImport = function(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if(Array.isArray(importedData)) {
                        document.getElementById('import-file').value = ''; 
                        showToast('Sedang memulihkan data... Mohon tunggu');
                        
                        let count = 0;
                        for(const item of importedData) { await addVaultItem(item); count++; }
                        
                        showToast(`${count} akun berhasil dipulihkan!`);
                        if (currentRoute === 'vault') loadVaultData(); 
                    } else {
                        showToast('Format JSON salah', 'error');
                    }
                } catch(err) { showToast('File bukan format JSON yang valid', 'error'); }
            };
            reader.readAsText(file);
        }

        // --- MANAJEMEN PIN ---
        window.openPinModal = function() {
            document.getElementById('old-pin').value = '';
            document.getElementById('new-pin').value = '';
            const modal = document.getElementById('pin-modal');
            const box = document.getElementById('pin-modal-box');
            modal.classList.remove('fallback-hidden');
            modal.style.display = 'flex';
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }
        window.closePinModal = function() {
            const modal = document.getElementById('pin-modal');
            const box = document.getElementById('pin-modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.style.display = 'none'; modal.classList.add('fallback-hidden'); }, 200);
        }
        window.saveNewPin = function() {
            const oldPin = document.getElementById('old-pin').value;
            const newPin = document.getElementById('new-pin').value;
            
            if (oldPin !== getMasterPin()) {
                showToast('PIN Lama Salah!', 'error'); return;
            }
            if (newPin.length < 4) {
                showToast('PIN Baru minimal 4 angka!', 'error'); return;
            }
            
            localStorage.setItem('warzt_master_pin', newPin);
            showToast('PIN Berhasil Diubah!');
            window.closePinModal();
        }

        function renderProfileView() {
            return `
                <div class="page-enter px-5 pt-10 pb-4">
                    <div class="mb-6"><h2 class="text-xl font-bold text-white">Security Overview</h2></div>
                    <div class="glass-card rounded-[1.5rem] p-5 text-center relative overflow-hidden shadow-xl border border-white/60">
                        <div class="absolute -right-10 -top-10 w-28 h-28 bg-brand-light rounded-full opacity-60 blur-2xl"></div>
                        <div class="w-16 h-16 bg-gradient-to-br from-brand-primary to-brand-dark text-white rounded-full flex items-center justify-center text-2xl mx-auto mb-3 shadow-xl shadow-brand-dark/20 border-[3px] border-white relative z-10"><i class="ph-fill ph-shield-check"></i></div>
                        <h3 class="text-lg font-bold text-slate-800 relative z-10">warzt Data Vault</h3>
                        <p class="text-[11px] text-slate-500 font-medium">Encrypted & Secured</p>
                        
                        <div class="space-y-2.5 relative z-10 mt-6 text-left">
                            
                            <h4 class="text-[10px] font-bold text-brand-primary uppercase tracking-wider mb-1.5 ml-1">Data Backup</h4>
                            <div class="flex gap-2.5">
                                <button onclick="window.exportData('json')" class="flex-1 bg-white text-slate-700 rounded-xl py-3 font-semibold shadow-sm border border-slate-100 hover:border-brand-light hover:bg-brand-bg text-[11px] flex justify-center items-center gap-1.5 transition-all"><i class="ph-bold ph-file-code text-sm text-brand-primary"></i> JSON</button>
                                <button onclick="window.exportData('csv')" class="flex-1 bg-white text-slate-700 rounded-xl py-3 font-semibold shadow-sm border border-slate-100 hover:border-brand-light hover:bg-brand-bg text-[11px] flex justify-center items-center gap-1.5 transition-all"><i class="ph-bold ph-file-csv text-sm text-brand-primary"></i> CSV</button>
                            </div>
                            
                            <input type="file" id="import-file" accept=".json" class="hidden" onchange="window.handleImport(event)">
                            <button onclick="window.triggerImport()" class="w-full bg-brand-light text-brand-primary rounded-xl py-3 font-bold shadow-sm border border-brand-secondary/20 hover:bg-brand-primary hover:text-white text-[11px] flex justify-center items-center gap-1.5 mt-1 transition-all"><i class="ph-bold ph-upload-simple text-sm"></i> Restore Data (Import)</button>

                            <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 mt-6 ml-1">Keamanan (Security)</h4>
                            <button onclick="window.openPinModal()" class="w-full bg-white text-slate-600 rounded-xl py-3 font-bold shadow-sm border border-slate-100 hover:border-brand-primary hover:text-brand-primary text-[11px] flex justify-center items-center gap-1.5 transition-all"><i class="ph-bold ph-key text-sm"></i> Ubah Master PIN</button>

                            <button onclick="window.handleLogout()" class="w-full bg-slate-50 text-slate-600 rounded-xl py-3 font-bold shadow-sm border border-slate-200 hover:bg-red-50 hover:text-red-500 hover:border-red-200 text-[11px] flex justify-center items-center gap-1.5 mt-1 transition-all"><i class="ph-bold ph-lock-key text-sm"></i> Lock Vault</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        window.handleLogout = function() { currentUser = null; showToast('Brankas terkunci'); navigate('login'); }
        window.onload = () => { render(); }
    </script>
</body>
